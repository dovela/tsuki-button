server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 默认允许任意 Host（方便托管不同子域），但拒绝空 Host 或纯 IP 访问
    set $deny_plain_ip 0;
    if ($host = "") { set $deny_plain_ip 1; }
    if ($host ~* "^(?:\\d{1,3}\\.){3}\\d{1,3}$") { set $deny_plain_ip 1; }
    if ($host ~* "^\\[[A-Fa-f0-9:]+\\]$") { set $deny_plain_ip 1; }
    if ($deny_plain_ip) { return 444; }

    # 如需只允许单一域名，可将 server_name 改为具体域名（示例：server_name button.mytsuki.cn;）
    # 并在 server 块顶部保留 deny_plain_ip 判定，防止绕过

    # 统一跳转到 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    set $deny_plain_ip 0;
    if ($host = "") { set $deny_plain_ip 1; }
    if ($host ~* "^(?:\\d{1,3}\\.){3}\\d{1,3}$") { set $deny_plain_ip 1; }
    if ($host ~* "^\\[[A-Fa-f0-9:]+\\]$") { set $deny_plain_ip 1; }
    if ($deny_plain_ip) { return 444; }

    # 若限定单域名（如 button.mytsuki.cn），此处同样替换 server_name，并确保证书 CN/ SAN 匹配

    # TLS 配置：在保留 TLSv1.3 的同时允许 TLSv1.2 客户端。
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|mp3|wav)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
